spring:
  application:
    name: jwt-oracle-auth

  datasource:
    # Thin driver, service-name syntax. For a TNS alias use jdbc:oracle:thin:@MYDB_ALIAS with -Doracle.net.tns_admin=<dir>
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: auth-oracle-pool
      maximum-pool-size: ${ORACLE_POOL_MAX_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1 FROM DUAL
      data-source-properties:
        oracle.jdbc.defaultRowPrefetch: 50
        oracle.net.CONNECT_TIMEOUT: 10000
        oracle.jdbc.ReadTimeout: 60000

  # Existing schema: never let Spring run schema.sql/data.sql against Oracle.
  sql:
    init:
      mode: never

  mvc:
    problemdetails:
      enabled: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.auth.user
  configuration:
    map-underscore-to-camel-case: true
    # Oracle rejects untyped NULL binds (JDBC type OTHER); bind NULL explicitly.
    jdbc-type-for-null: 'NULL'
    default-fetch-size: 100
    default-statement-timeout: 30
    cache-enabled: false

app:
  security:
    jwt:
      # Base64-encoded key of at least 256 bits, e.g.:  openssl rand -base64 32
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:jwt-oracle-auth}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      clock-skew: 30s

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    com.example.auth: INFO
